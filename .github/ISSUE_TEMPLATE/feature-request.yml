name: ✨ Feature Request
description: Suggest a new feature or enhancement for the CLI scraper tool
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please provide as much detail as possible so we can evaluate it.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem are you trying to solve? Is your request related to a limitation you've run into?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you'd like to happen
    validations:
      required: true

  - type: textarea
    id: example-command
    attributes:
      label: Example Usage
      description: Show what the CLI command/flags might look like with this feature
      render: shell
      placeholder: "uv run asset-scraper https://example.com --new-flag"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions, workarounds, or existing tools you've tried
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What area does this feature relate to?
      options:
        - Asset scraping (images, CSS, JS, fonts, etc.)
        - Output / file organization
        - Performance / concurrency
        - Authentication / headers / cookies
        - Filtering / selective scraping
        - CLI UX / flags / config
        - Logging / debugging
        - Other
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, links to similar tools, or references here
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues/discussions to make sure this isn't a duplicate
          required: true
        - label: This feature aligns with the tool's core purpose (scraping website assets)
          required: false
